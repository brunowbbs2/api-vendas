apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendas-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendas-service
  template:
    metadata:
      labels:
        app: vendas-service
    spec:
      initContainers:
        - name: espera-eureka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z eureka-server 8761; do sleep 2; done']
        - name: espera-config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z config-server 8888; do sleep 2; done']
      containers:
        - name: vendas-service
          image: vendas-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
          readinessProbe:
            tcpSocket: { port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vendas-service
  namespace: ecommerce
spec:
  selector:
    app: vendas-service
  ports:
    - port: 8082
      targetPort: 8082